name: Build desktop artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*-alpha*"]

permissions:
  contents: read

jobs:
  windows-portable:
    name: Windows x64 portable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install desktop packaging dependencies
        run: python -m pip install -e ".[gui,packaging]"

      - name: Build one-folder application
        run: python -m PyInstaller --noconfirm --clean packaging/safeinstall.spec

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\SafeInstall\SafeInstall.exe" `
            -ArgumentList "--smoke-test","-platform","offscreen" `
            -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged SafeInstall exited with code $($process.ExitCode)"
          }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\SafeInstall -DestinationPath SafeInstall-Windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SafeInstall-Windows-x64
          path: SafeInstall-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  macos-app:
    name: macOS app (unsigned development build)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install desktop packaging dependencies
        run: python -m pip install -e ".[gui,packaging]"

      - name: Build application bundle
        run: python -m PyInstaller --noconfirm --clean packaging/safeinstall.spec

      - name: Smoke-test packaged application
        run: dist/SafeInstall.app/Contents/MacOS/SafeInstall --smoke-test

      - name: Create app ZIP
        run: ditto -c -k --sequesterRsrc --keepParent dist/SafeInstall.app SafeInstall-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SafeInstall-macOS
          path: SafeInstall-macOS.zip
          if-no-files-found: error
          retention-days: 14
