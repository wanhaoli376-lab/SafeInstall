name: Alpha user feedback
description: Tell us whether the desktop alpha started, scanned, and explained its result clearly.
title: "[Alpha feedback]: "
labels: [alpha-feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing SafeInstall. Do not upload confidential files, API keys,
        passwords, private source code, full local paths, or unredacted reports.
  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux / source installation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SafeInstall version
      placeholder: 0.2.0a1
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: What were you scanning?
      options:
        - Local file
        - Local folder
        - ZIP or TAR archive
        - Public GitHub repository
    validations:
      required: true
  - type: dropdown
    id: startup
    attributes:
      label: Did the app start?
      options: ["Yes", "No"]
    validations:
      required: true
  - type: dropdown
    id: completion
    attributes:
      label: Did scanning finish?
      options: ["Yes", "No", "Not attempted"]
    validations:
      required: true
  - type: dropdown
    id: understandable
    attributes:
      label: Was the report understandable?
      options: ["Yes", "Partly", "No", "No report was produced"]
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What worked, and what was confusing?
      description: Use generic or sanitized names instead of real local paths.
    validations:
      required: true
  - type: textarea
    id: false_positives
    attributes:
      label: Were there false positives?
      description: Include Rule IDs and a minimal sanitized example; do not attach private code.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, secrets, private code, and identifying local paths.
          required: true
