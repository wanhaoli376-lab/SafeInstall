name: Feature request
description: Propose a user-focused SafeInstall improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is affected, and what can they not understand or do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Untrusted-input and privacy considerations
      description: Note execution, filesystem, network, secret, plugin, or AI implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
