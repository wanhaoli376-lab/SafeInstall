name: False positive
description: Explain why a finding is misleading in a specific benign context.
title: "[False positive]: "
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: SI-PY-001
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal inert example and report evidence
      description: Redact all secrets and do not submit executable harmful code.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why this context is benign or lower risk
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested detection or wording change
      description: Include cases that must continue to match.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I understand that a capability finding is not a claim of malicious intent.
          required: true
