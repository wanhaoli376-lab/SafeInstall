- id: SI-SH-001
  name: Download piped to a shell
  description: A network download is sent directly to a shell interpreter.
  severity: high
  category: download_and_execute
  language: shell
  pattern: '\b(?:curl|wget)\b[^|#\n]*\|\s*(?:bash|sh)\b'
  explanation: This command downloads text from the network and immediately runs it as shell code.
  recommendation: Download the script first, inspect it, and only then run a trusted local copy.
  capabilities:
    - network_access
    - download_execute
    - shell_execution

- id: SI-SH-002
  name: Decoded content piped to a shell
  description: Base64-decoded content is sent directly to a shell interpreter.
  severity: critical
  category: obfuscated_execution
  language: shell
  pattern: '\bbase64\b[^|#\n]*(?:-d|--decode)[^|#\n]*\|\s*(?:bash|sh)\b'
  explanation: Decoding content immediately before execution can hide the command that will run.
  recommendation: Decode into a file, inspect the result, and do not run it unless the source is trusted.
  capabilities:
    - code_execution
    - shell_execution

- id: SI-SH-003
  name: Recursive forced deletion
  description: rm is invoked with recursive and force options.
  severity: high
  category: destructive_file_operation
  language: shell
  pattern: '\brm\s+(?:-[^\s]*r[^\s]*f|-[^\s]*f[^\s]*r)\b'
  explanation: This command can remove a directory tree without asking for confirmation.
  recommendation: Verify the resolved target path and ensure variables cannot be empty or unexpected.
  capabilities:
    - file_delete

- id: SI-SH-004
  name: File ownership or permission change
  description: The script changes file permissions or ownership.
  severity: medium
  category: permission_change
  language: shell
  pattern: '\b(?:chmod|chown)\b'
  explanation: Permission changes affect who can read, write, or execute files.
  recommendation: Review which paths and permission modes are changed.
  capabilities:
    - filesystem_write

- id: SI-SH-005
  name: Privileged command request
  description: The script invokes sudo to request elevated execution.
  severity: high
  category: privilege_escalation
  language: shell
  pattern: '\bsudo\b'
  explanation: This command can ask to run another operation with elevated privileges. It does not by itself create persistence.
  recommendation: Review the complete elevated command and confirm that system-level access is necessary.
  capabilities:
    - privilege_escalation

- id: SI-SH-006
  name: Network download
  description: The script uses curl or wget to access the network.
  severity: low
  category: network_access
  language: shell
  pattern: '\b(?:curl|wget)\b'
  explanation: This script can download or send data over the network; network access alone is not malicious.
  recommendation: Review the destination domain and how the response is used.
  capabilities:
    - network_access

- id: SI-SH-007
  name: Remote host access
  description: The script invokes ssh or scp.
  severity: medium
  category: remote_access
  language: shell
  pattern: '\b(?:ssh|scp)\b'
  explanation: This script can connect to another computer or transfer files.
  recommendation: Review the remote host, authentication method, and transferred paths.
  capabilities:
    - network_access

- id: SI-SH-008
  name: System service or schedule access
  description: The script invokes systemctl or crontab.
  severity: medium
  category: system_configuration
  language: shell
  pattern: '\b(?:systemctl|crontab)\b'
  explanation: This command can inspect or change services and scheduled tasks. The command name alone does not prove that a persistent change is made.
  recommendation: Review the subcommand and arguments to determine whether system state is modified.

- id: SI-SH-009
  name: Persistent service or schedule change
  description: The script enables a service or modifies a user's scheduled tasks.
  severity: high
  category: persistence
  language: shell
  pattern: '\bsystemctl\s+(?:enable|reenable)\b|\bcrontab\s+(?:-[er]\b|[^-\s#][^\s#]*)'
  explanation: Enabling a service or installing or editing a crontab can arrange for commands to run again later.
  recommendation: Review the enabled service or complete schedule and confirm that persistence is expected.
  capabilities:
    - persistence

- id: SI-SH-010
  name: Git repository operation
  description: The script invokes a Git command that can inspect or change repository state.
  severity: low
  category: git_operation
  language: shell
  pattern: '\bgit\s+(?:clone|fetch|pull|push|checkout|switch|reset|clean|submodule|worktree|commit|tag|branch)\b'
  explanation: This script can read or change Git repository state or communicate with a Git remote. That capability is common in developer tooling.
  recommendation: Review the repository, remote, ref, and arguments used by the Git command.
  capabilities:
    - git_operations
