[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "safeinstall"
version = "0.2.0a2"
description = "Understand software before you run it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "SafeInstall contributors" },
]
keywords = ["security", "static-analysis", "supply-chain", "mcp", "cli", "desktop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
ai = ["openai>=1.66,<3"]
gui = ["PySide6>=6.8,<6.11"]
gui-test = ["pytest-qt>=4.4,<5"]
packaging = ["PyInstaller>=6.18,<7"]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
safeinstall = "safeinstall.cli:app"
safeinstall-gui = "safeinstall.gui.launcher:main"

[project.urls]
Documentation = "https://github.com/wanhaoli376-lab/SafeInstall#readme"
Issues = "https://github.com/wanhaoli376-lab/SafeInstall/issues"
Source = "https://github.com/wanhaoli376-lab/SafeInstall"

[tool.hatch.build.targets.wheel]
packages = ["src/safeinstall"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests/security/test_secret_redaction.py" = ["S105"]
"tests/security/test_ai_prompt_isolation.py" = ["S105"]
"tests/unit/test_ai_components_scanner.py" = ["S105"]
